# docker-compose.yml

services:
  app:
    build: .
    image: nexusquant-app
    ports: 
      - '8000:8000'
      - '5433:5432'
      - '6379:6379'
    env_file: .env
    restart: unless-stopped
    volumes: 
      - .:/app
      - pg_data:/var/lib/postgresql/data
      - redis_data:/var/lib/redis

volumes:
  redis_data:
  pg_data:
