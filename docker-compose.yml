# docker-compose.yml

services:
  app:                          # Single app container: API + internal workers
    build: .
    image: nexusquant-app
    ports: ['8000:8000']
    command: ./scripts/entrypoint_single_container.sh
    env_file: .env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes: ['./app:/app/app']  # Hot reload for development code edits

  redis:
    image: redis:7-alpine
    volumes: ['redis_data:/data']

  postgres:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: NexusQuantDB
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: ['pg_data:/var/lib/postgresql/data']
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d NexusQuantDB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  pg_data:
