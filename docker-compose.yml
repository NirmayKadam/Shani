# docker-compose.yml

services:
  app:                          # FastAPI REST API + WebSocket
    build: .
    image: nexusquant-app
    ports: ['8000:8000']
    command: uvicorn app.main:App --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes: ['./app:/app/app']  # Hot reload for development

  worker-ingestion:             # Data Ingestion workers
    image: nexusquant-app
    command: celery -A app.celery_app worker -Q ingestion -c 2 --loglevel=info
    env_file: .env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes: ['./app:/app/app']

  worker-nlp:                   # NLP + Sentiment workers — native event subscriber
    image: nexusquant-app
    command: python -m app.domain.sentiment.event_subscriber
    env_file: .env
    depends_on: [redis, postgres]
    volumes: ['./app:/app/app']

  beat:                         # Celery Beat scheduler
    image: nexusquant-app
    command: celery -A app.celery_app beat --loglevel=info
    env_file: .env
    depends_on: [redis]
    volumes: ['./app:/app/app']

  flower:                       # Task monitoring dashboard
    image: nexusquant-app
    command: celery -A app.celery_app flower --port=5555
    ports: ['5555:5555']
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    volumes: ['redis_data:/data']

  postgres:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: NexusQuantDB
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: ['pg_data:/var/lib/postgresql/data']
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d NexusQuantDB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  pg_data:
