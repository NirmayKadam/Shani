<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaStreams V2 Terminal</title>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Load required display fonts -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Local CSS -->
    <link rel="stylesheet" href="/ui/static/css/main.css">
    <link rel="stylesheet" href="/ui/static/css/skeleton.css">
    <link rel="stylesheet" href="/ui/static/css/modal.css">

    <script>
        {% block global_config %}{% endblock %}
    </script>
</head>
<body>

    <!-- Fixed Top Bar -->
    <header class="topbar">
        <div class="topbar-logo">ALPHASTREAMS</div>
        <div class="topbar-clock" id="topbar-clock">LOADING...</div>
        <div class="topbar-status" id="topbar-status"></div>
    </header>

    <!-- Modal Overlay Base -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">MODAL</div>
                <div class="modal-close">✕ CLOSE</div>
            </div>
            <div class="modal-body" id="modal-body-content"></div>
        </div>
    </div>

    <!-- Main Shell -->
    <main class="shell">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Global Layout Logic Scripts -->
    <script src="/ui/static/js/modal.js"></script>
    <script src="/ui/static/js/charts.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
