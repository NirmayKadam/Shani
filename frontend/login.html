<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="split-layout">
        <!-- Left Panel: Authentication -->
        <div class="auth-panel">
            <div class="auth-content" style="max-width: 400px; text-align: center;">
                <div class="header">
                    <h1>Welcome Back</h1>
                    <p style="margin-top: 10px; margin-bottom: 30px;">Sign in to access your personalized dashboard.</p>
                </div>

                <div class="social-logins" style="margin-bottom: 2rem;">
                    <!-- Expanded Google Button since it's the only option -->
                    <button class="primary-btn" id="googleLoginBtn">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google" />
                        Sign in with Google
                    </button>
                </div>

                <p class="footer-text">
                    Join the millions of smart investors who trust us to manage their finances. Log in to track your portfolio performance and make informed investment decisions.
                </p>
            </div>
        </div>

        <!-- Right Panel: Visual Showcase -->
        <div class="visual-panel">
            <div class="decoration dec-1"></div>
            <div class="decoration dec-2"></div>
            <div class="decoration dec-3"></div>
            <div class="decoration dec-4"></div>
            <!-- Original Image -->
            <img src="bull_image.png" alt="3D Finance Bull" class="hero-image">
        </div>
    </div>
    
    <!-- Firebase Integration -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCKupNn5aElu7c07LcYJS0J0mWzCKo2EQc",
            authDomain: "alphastreams-14879.firebaseapp.com",
            projectId: "alphastreams-14879",
            storageBucket: "alphastreams-14879.firebasestorage.app",
            messagingSenderId: "849439984965",
            appId: "1:849439984965:web:76934b9c49d9fdbd71422c"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    // Login successful
                    window.location.href = '/dashboard.html';
                })
                .catch((error) => {
                    // Handle Errors here
                    console.error(error);
                    alert("Login failed: " + error.message);
                });
        });
    </script>
</body>
</html>
