[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Plain `pytest` stays offline. Run the rest explicitly: pytest -m integration / pytest -m live
addopts = -m "not integration and not live"
markers =
    unit: Unit tests (no external services needed)
    integration: Integration tests (needs Redis, Postgres, or live APIs)
    live: Tests that hit external APIs (NSE, yfinance)
